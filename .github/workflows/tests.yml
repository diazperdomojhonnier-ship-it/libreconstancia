name: Pruebas
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python -m pip install -e '.[qr]'
      - run: node --check src/libreconstancia/static/verify.js
      - run: node --check examples/demo/demo.js
      - run: python tools/build_demo_site.py --check
      - run: python -m unittest discover -s tests -v
