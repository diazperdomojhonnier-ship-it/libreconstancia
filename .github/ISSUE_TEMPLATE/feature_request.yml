name: Propuesta de mejora
description: Comparte una necesidad real de uso educativo o comunitario.
title: "[Idea] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema que quieres resolver
      placeholder: "En una organización de formación pequeña necesitamos..."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Solución propuesta y alternativas
      description: Explica quién la usaría y cómo se podría probar.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidad
      options:
        - label: "Esta propuesta no incluye datos personales, contraseñas ni claves privadas."
          required: true
