name: Informe de error
description: Reporta un comportamiento reproducible sin compartir datos personales.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "No adjuntes claves privadas, datos reales de estudiantes ni documentos confidenciales. Para vulnerabilidades, consulta SECURITY.md."
  - type: textarea
    id: issue
    attributes:
      label: ¿Qué ocurrió?
      description: Explica el resultado observado y el resultado esperado.
      placeholder: "Al ejecutar..., esperaba..., pero ocurrió..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      description: Usa únicamente datos ficticios.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de LibreConstancia y Python
      placeholder: "0.2.0 / Python 3.12"
    validations:
      required: true
